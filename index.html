<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>联网五子棋</title>
<style>
body{background:#d4b886;display:flex;flex-direction:column;align-items:center;font-family:"Microsoft YaHei"}
#board{border:2px solid #000;background:#d4b886}
.info{font-size:18px;margin:10px}
button{padding:8px 16px;font-size:16px;margin:5px}
</style>
</head>
<body>
<div class="info">状态：<span id="status">正在连接...</span></div>
<div class="info">回合：<span id="turn">-</span></div>
<canvas id="board" width="570" height="570"></canvas>
<div>
<button id="restart">重新开始</button>
</div>

<script>
// ===== 棋盘配置 =====
const GRID=19,SIZE=30;
const canvas=document.getElementById('board');
const ctx=canvas.getContext('2d');

let board=Array(GRID).fill().map(()=>Array(GRID).fill(0));
let me=0; // 1黑 2白
let turn=1;
let gameOver=false;
let socket;

// ===== 画棋盘 =====
function drawBoard(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle='#000';
    for(let i=0;i<GRID;i++){
        ctx.beginPath();
        ctx.moveTo(SIZE/2+i*SIZE,SIZE/2);
        ctx.lineTo(SIZE/2+i*SIZE,canvas.height-SIZE/2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(SIZE/2,SIZE/2+i*SIZE);
        ctx.lineTo(canvas.width-SIZE/2,SIZE/2+i*SIZE);
        ctx.stroke();
    }
}

// ===== 画棋子 =====
function drawPiece(x,y,color){
    let cx=SIZE/2+x*SIZE;
    let cy=SIZE/2+y*SIZE;
    ctx.beginPath();
    ctx.arc(cx,cy,SIZE/2-2,0,Math.PI*2);
    if(color===1){
        ctx.fillStyle='#000';
        ctx.fill();
    }else{
        ctx.fillStyle='#fff';
        ctx.fill();
        ctx.strokeStyle='#000';
        ctx.stroke();
    }
}

// ===== 判断胜负 =====
function checkWin(x,y,color){
    let dirs=[[1,0],[0,1],[1,1],[1,-1]];
    for(let [dx,dy] of dirs){
        let cnt=1;
        for(let i=1;i<5;i++){
            let nx=x+dx*i, ny=y+dy*i;
            if(nx>=0&&nx<GRID&&ny>=0&&ny<GRID&&board[ny][nx]===color) cnt++;
            else break;
        }
        for(let i=1;i<5;i++){
            let nx=x-dx*i, ny=y-dy*i;
            if(nx>=0&&nx<GRID&&ny>=0&&ny<GRID&&board[ny][nx]===color) cnt++;
            else break;
        }
        if(cnt>=5) return true;
    }
    return false;
}

// ===== 落子 =====
function place(x,y){
    if(gameOver) return;
    if(turn!==me) return;
    if(x<0||x>=GRID||y<0||y>=GRID||board[y][x]!==0) return;

    board[y][x]=me;
    drawPiece(x,y,me);

    if(checkWin(x,y,me)){
        gameOver=true;
        document.getElementById('status').innerText=me===1?"黑棋胜利！":"白棋胜利！";
        return;
    }

    turn=me===1?2:1;
    document.getElementById('turn').innerText=turn===1?"黑棋回合":"白棋回合";

    // 发给对方
    socket.send(JSON.stringify({type:"move",x:x,y:y,color:me}));
}

// ===== 重新开始 =====
function restart(){
    board=Array(GRID).fill().map(()=>Array(GRID).fill(0));
    turn=1;
    gameOver=false;
    drawBoard();
    document.getElementById('turn').innerText="黑棋回合";
    document.getElementById('status').innerText="游戏中";
    socket.send(JSON.stringify({type:"restart"}));
}

// ===== 鼠标点击 =====
canvas.onclick=function(e){
    let x=Math.round((e.offsetX-SIZE/2)/SIZE);
    let y=Math.round((e.offsetY-SIZE/2)/SIZE);
    place(x,y);
};
document.getElementById('restart').onclick=restart;

// ===== 联网（简易版，同房间自动配对） =====
function connect(){
    // 这里用公共免费多人服务器（我写死一个简易房间）
    let room="wuziqi-room-001";
    socket=new WebSocket("wss://echo.websocket.org"); // 公共测试服务器

    socket.onopen=()=>{
        document.getElementById('status').innerText="已连接，等待对手...";
    };

    socket.onmessage=(evt)=>{
        let msg;
        try{msg=JSON.parse(evt.data);}catch{return;}
        if(msg.type==="move"){
            board[msg.y][msg.x]=msg.color;
            drawPiece(msg.x,msg.y,msg.color);
            if(checkWin(msg.x,msg.y,msg.color)){
                gameOver=true;
                document.getElementById('status').innerText=msg.color===1?"黑棋胜利！":"白棋胜利！";
            }else{
                turn=msg.color===1?2:1;
                document.getElementById('turn').innerText=turn===1?"黑棋回合":"白棋回合";
            }
        }else if(msg.type==="restart"){
            board=Array(GRID).fill().map(()=>Array(GRID).fill(0));
            turn=1;
            gameOver=false;
            drawBoard();
            document.getElementById('turn').innerText="黑棋回合";
            document.getElementById('status').innerText="游戏中";
        }
    };

    socket.onerror=()=>{
        document.getElementById('status').innerText="连接错误，请刷新";
    };

    socket.onclose=()=>{
        document.getElementById('status').innerText="断开连接，刷新重连";
    };

    // 简单分配黑白：先连=黑，后连=白
    setTimeout(()=>{
        if(me===0){
            me=1;
            document.getElementById('status').innerText="你是黑棋（先手）";
            document.getElementById('turn').innerText="黑棋回合";
        }else{
            me=2;
            document.getElementById('status').innerText="你是白棋（后手）";
            document.getElementById('turn').innerText="黑棋回合";
        }
    },800);
}

drawBoard();
connect();
</script>
</body>
</html>
