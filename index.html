<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>单机五子棋</title>
<style>
body {
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: "Microsoft YaHei", sans-serif;
}
#board {
    background: #d4b886;
    border: 2px solid #000;
}
.tip {
    margin: 10px 0;
    font-size: 16px;
}
</style>
</head>
<body>
<div class="tip">操作：鼠标左键落子 | 右键/退格悔棋 | 方向键移动 | 空格落子 | C键归位</div>
<canvas id="board" width="570" height="570"></canvas>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const GRID = 19;
const CELL = 30;

// 游戏全局变量（对应你MATLAB代码）
let win = 0;          // 0对局中 1黑胜 -1白胜
let control = 1;      // 1黑棋 0白棋
let postion = [0, 0]; // 光标位置
let black = [];       // 黑棋坐标
let white = [];       // 白棋坐标

// 绘制棋盘
function drawBoard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "#000";
    // 网格线
    for (let i = 0; i < GRID; i++) {
        let pos = CELL / 2 + i * CELL;
        ctx.beginPath();
        ctx.moveTo(pos, CELL / 2);
        ctx.lineTo(pos, canvas.height - CELL / 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(CELL / 2, pos);
        ctx.lineTo(canvas.width - CELL / 2, pos);
        ctx.stroke();
    }
    // 四角+天元点位
    const dots = [
        [3,3], [3,15], [9,9], [15,3], [15,15]
    ];
    ctx.fillStyle = "#000";
    dots.forEach(([x,y]) => {
        let cx = CELL/2 + x * CELL;
        let cy = CELL/2 + y * CELL;
        ctx.beginPath();
        ctx.arc(cx, cy, 4, 0, Math.PI * 2);
        ctx.fill();
    });
}

// 绘制所有棋子 + 光标
function drawAll() {
    drawBoard();
    // 画黑棋
    black.forEach(([x,y]) => {
        let cx = CELL/2 + (x + 9) * CELL;
        let cy = CELL/2 + (y + 9) * CELL;
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(cx, cy, CELL/2 - 2, 0, Math.PI * 2);
        ctx.fill();
    });
    // 画白棋
    white.forEach(([x,y]) => {
        let cx = CELL/2 + (x + 9) * CELL;
        let cy = CELL/2 + (y + 9) * CELL;
        ctx.fillStyle = "#fff";
        ctx.strokeStyle = "#000";
        ctx.beginPath();
        ctx.arc(cx, cy, CELL/2 - 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    });
    // 红色光标
    let cx = CELL/2 + (postion[0] + 9) * CELL;
    let cy = CELL/2 + (postion[1] + 9) * CELL;
    ctx.strokeStyle = "#f00";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, CELL/2 - 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 1;
}

// 胜负判断（完全复刻你的MATLAB逻辑）
function panding() {
    if (black.length === 0 && white.length === 0) return;
    let qipan = Array(GRID).fill().map(() => Array(GRID).fill(0));
    // 映射坐标
    black.forEach(([x,y]) => {
        let tx = x + 9;
        let ty = y + 9;
        qipan[ty][tx] = 1;
    });
    white.forEach(([x,y]) => {
        let tx = x + 9;
        let ty = y + 9;
        qipan[ty][tx] = -1;
    });

    // 四个方向判断五子连珠
    const dirs = [[1,0],[0,1],[1,1],[1,-1]];
    for (let y = 0; y < GRID; y++) {
        for (let x = 0; x < GRID; x++) {
            let cur = qipan[y][x];
            if (cur === 0) continue;
            for (let [dx, dy] of dirs) {
                let cnt = 1;
                // 正向
                for (let k = 1; k < 5; k++) {
                    let nx = x + dx * k;
                    let ny = y + dy * k;
                    if (nx >=0 && nx < GRID && ny >=0 && ny < GRID && qipan[ny][nx] === cur) cnt++;
                    else break;
                }
                // 反向
                for (let k = 1; k < 5; k++) {
                    let nx = x - dx * k;
                    let ny = y - dy * k;
                    if (nx >=0 && nx < GRID && ny >=0 && ny < GRID && qipan[ny][nx] === cur) cnt++;
                    else break;
                }
                if (cnt >= 5) {
                    win = cur;
                    return;
                }
            }
        }
    }
}

// 落子逻辑
function place() {
    let exist = false;
    for (let p of black) {
        if (p[0] === postion[0] && p[1] === postion[1]) { exist = true; break; }
    }
    for (let p of white) {
        if (p[0] === postion[0] && p[1] === postion[1]) { exist = true; break; }
    }
    if (exist) return;

    if (control === 1) {
        black.push([...postion]);
    } else {
        white.push([...postion]);
    }
    control = (control + 1) % 2;
}

// 悔棋逻辑
function undo() {
    let ok = false;
    if (control === 0 && black.length > 0) {
        black.pop();
        ok = true;
    }
    if (control === 1 && white.length > 0) {
        white.pop();
        ok = true;
    }
    if (ok) {
        control = (control + 1) % 2;
    }
}

// 重置游戏
function resetGame() {
    win = 0;
    control = 1;
    black = [];
    white = [];
    postion = [0, 0];
    drawAll();
}

// 键盘事件
document.addEventListener('keydown', (e) => {
    if (win !== 0) return;
    switch(e.key.toLowerCase()) {
        case 'arrowup':
            postion[1] += 1;
            break;
        case 'arrowdown':
            postion[1] -= 1;
            break;
        case 'arrowleft':
            postion[0] -= 1;
            break;
        case 'arrowright':
            postion[0] += 1;
            break;
        case 'c':
            postion = [0, 0];
            break;
        case ' ':
            e.preventDefault();
            place();
            break;
        case 'backspace':
            undo();
            break;
    }
    // 边界限制
    postion[0] = Math.max(-9, Math.min(9, postion[0]));
    postion[1] = Math.max(-9, Math.min(9, postion[1]));
    panding();
    checkWinAlert();
    drawAll();
});

// 鼠标事件
canvas.addEventListener('mousedown', (e) => {
    if (win !== 0) return;
    let rect = canvas.getBoundingClientRect();
    let mx = e.clientX - rect.left;
    let my = e.clientY - rect.top;
    // 坐标转换
    let x = Math.round((mx - CELL/2) / CELL) - 9;
    let y = Math.round((my - CELL/2) / CELL) - 9;
    postion = [x, y];

    // 右键悔棋
    if (e.button === 2) {
        undo();
    } else {
        place();
    }
    panding();
    checkWinAlert();
    drawAll();
});

// 禁止右键菜单
canvas.addEventListener('contextmenu', e => e.preventDefault());

// 胜负弹窗
function checkWinAlert() {
    if (win === 1) {
        setTimeout(() => {
            if (confirm("黑棋获胜！是否重新开始？")) {
                resetGame();
            }
        }, 100);
    } else if (win === -1) {
        setTimeout(() => {
            if (confirm("白棋获胜！是否重新开始？")) {
                resetGame();
            }
        }, 100);
    }
}

// 初始化
drawAll();
</script>
</body>
</html>
