<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>双人联网五子棋</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #d4b886;
            font-family: "Microsoft YaHei", sans-serif;
        }
        #board {
            border: 2px solid #333;
            background: #d4b886;
        }
        .info {
            margin: 10px;
            font-size: 18px;
        }
        button {
            padding: 8px 16px;
            font-size: 16px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="info">状态：<span id="status">正在连接...</span></div>
    <div class="info">回合：<span id="turn">-</span></div>
    <canvas id="board" width="570" height="570"></canvas>
    <button id="restart">重新开始</button>

<script>
// ===== 核心配置 =====
const GRID = 19;
const SIZE = 30;
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const turnEl = document.getElementById('turn');

let board = Array(GRID).fill().map(() => Array(GRID).fill(0));
let me = 0; // 1黑 2白
let turn = 1;
let gameOver = false;
let peerId;

// ===== 棋盘绘制 =====
function drawBoard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#000';
    for (let i = 0; i < GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(SIZE/2 + i*SIZE, SIZE/2);
        ctx.lineTo(SIZE/2 + i*SIZE, canvas.height - SIZE/2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(SIZE/2, SIZE/2 + i*SIZE);
        ctx.lineTo(canvas.width - SIZE/2, SIZE/2 + i*SIZE);
        ctx.stroke();
    }
}

function drawPiece(x, y, color) {
    const cx = SIZE/2 + x*SIZE;
    const cy = SIZE/2 + y*SIZE;
    ctx.beginPath();
    ctx.arc(cx, cy, SIZE/2-2, 0, Math.PI*2);
    if (color === 1) {
        ctx.fillStyle = '#000';
        ctx.fill();
    } else {
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.stroke();
    }
}

// ===== 胜负判断 =====
function checkWin(x, y, color) {
    const dirs = [[1,0],[0,1],[1,1],[1,-1]];
    for (const [dx, dy] of dirs) {
        let cnt = 1;
        for (let i = 1; i < 5; i++) {
            const nx = x + dx*i, ny = y + dy*i;
            if (nx >= 0 && nx < GRID && ny >= 0 && ny < GRID && board[ny][nx] === color) cnt++;
            else break;
        }
        for (let i = 1; i < 5; i++) {
            const nx = x - dx*i, ny = y - dy*i;
            if (nx >= 0 && nx < GRID && ny >= 0 && ny < GRID && board[ny][nx] === color) cnt++;
            else break;
        }
        if (cnt >= 5) return true;
    }
    return false;
}

// ===== 联机逻辑（使用p2p服务器） =====
const socket = new WebSocket('wss://multiplayernodejs-server.herokuapp.com');

socket.onopen = () => {
    statusEl.innerText = '已连接，等待对手加入...';
};

socket.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if (msg.type === 'init') {
        peerId = msg.id;
        if (msg.role === 'host') {
            me = 1;
            statusEl.innerText = '你是黑棋（先手）';
            turnEl.innerText = '黑棋回合';
        } else {
            me = 2;
            statusEl.innerText = '你是白棋（后手）';
            turnEl.innerText = '黑棋回合';
        }
    } else if (msg.type === 'move') {
        board[msg.y][msg.x] = msg.color;
        drawPiece(msg.x, msg.y, msg.color);
        if (checkWin(msg.x, msg.y, msg.color)) {
            gameOver = true;
            statusEl.innerText = msg.color === 1 ? '黑棋胜利！' : '白棋胜利！';
        } else {
            turn = msg.color === 1 ? 2 : 1;
            turnEl.innerText = turn === 1 ? '黑棋回合' : '白棋回合';
        }
    } else if (msg.type === 'restart') {
        board = Array(GRID).fill().map(() => Array(GRID).fill(0));
        turn = 1;
        gameOver = false;
        drawBoard();
        turnEl.innerText = '黑棋回合';
        statusEl.innerText = '游戏中';
    }
};

// ===== 落子逻辑 =====
function place(x, y) {
    if (gameOver || turn !== me) return;
    if (x < 0 || x >= GRID || y < 0 || y >= GRID || board[y][x] !== 0) return;

    board[y][x] = me;
    drawPiece(x, y, me);

    if (checkWin(x, y, me)) {
        gameOver = true;
        statusEl.innerText = me === 1 ? '黑棋胜利！' : '白棋胜利！';
    } else {
        turn = me === 1 ? 2 : 1;
        turnEl.innerText = turn === 1 ? '黑棋回合' : '白棋回合';
    }

    // 发送给对手
    socket.send(JSON.stringify({ type: 'move', x, y, color: me }));
}

// ===== 鼠标点击 =====
canvas.onclick = (e) => {
    const x = Math.round((e.offsetX - SIZE/2) / SIZE);
    const y = Math.round((e.offsetY - SIZE/2) / SIZE);
    place(x, y);
};

// ===== 重新开始 =====
document.getElementById('restart').onclick = () => {
    board = Array(GRID).fill().map(() => Array(GRID).fill(0));
    turn = 1;
    gameOver = false;
    drawBoard();
    turnEl.innerText = '黑棋回合';
    statusEl.innerText = '游戏中';
    socket.send(JSON.stringify({ type: 'restart' }));
};

// 初始化
drawBoard();
</script>
</body>
</html>
